<style>
/* ---------- Style iOS 26 : verre, halo de couleur, dégradés, chiffres arrondis ----------
   Comme l'appli sport : un halo de couleur en haut de l'écran, des cartes en verre, un dégradé sur le bouton principal, les jauges et le grand chiffre.
   Clair et sombre suivent l'iPhone. Une palette par onglet (vert d'eau vers bleu, vert, violet, bleu), chaude (orange vers rouge) quand le mois est dépassé. */
@property --c0 { syntax: '<color>'; inherits: true; initial-value: #0B8F7A; }
@property --c1 { syntax: '<color>'; inherits: true; initial-value: #2158D6; }
@property --glow { syntax: '<color>'; inherits: true; initial-value: rgba(47,123,255,.30); }
@property --glow2 { syntax: '<color>'; inherits: true; initial-value: rgba(25,195,164,.26); }
:root {
  --bg: #F2F2F7; --card: #FFFFFF; --card2: #F2F2F7; --fg: #000000; --fg2: rgba(60,60,67,.66); --fg3: rgba(60,60,67,.3); --sep: rgba(60,60,67,.16);
  --fill: rgba(120,120,128,.12); --glass: rgba(250,250,252,.72); --glass-edge: rgba(255,255,255,.65);
  --verre: rgba(255,255,255,.74); --verre-bord: inset 0 0 0 .5px rgba(255,255,255,.95), 0 1px 2px rgba(25,35,70,.05), 0 12px 28px -14px rgba(30,50,110,.20);
  --seg-on: #FFFFFF; --seg-bord: 0 2px 6px rgba(0,0,0,.14), inset 0 0 0 .5px rgba(0,0,0,.04);
  --on-accent: #FFFFFF;
  --green: #34C759; --orange: #FF9500; --red: #FF3B30; --blue: #007AFF; --indigo: #5856D6; --teal: #30B0C7; --gray: #8E8E93; --yellow: #FFCC00;
  --sf: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
  --sfr: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --haut: env(safe-area-inset-top, 0px); --bas: env(safe-area-inset-bottom, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #06080D; --card: #1C1D22; --card2: #2C2C2E; --fg: #FFFFFF; --fg2: rgba(235,235,245,.62); --fg3: rgba(235,235,245,.3); --sep: rgba(255,255,255,.10);
  --fill: rgba(120,120,128,.24); --glass: rgba(34,36,44,.62); --glass-edge: rgba(255,255,255,.14);
  --verre: rgba(255,255,255,.065); --verre-bord: inset 0 0 0 .5px rgba(255,255,255,.14), inset 0 1px 0 rgba(255,255,255,.09);
  --seg-on: rgba(255,255,255,.15); --seg-bord: inset 0 0 0 .5px rgba(255,255,255,.18), 0 2px 6px rgba(0,0,0,.25);
  --on-accent: #07131C;
  --green: #30D158; --orange: #FF9F0A; --red: #FF453A; --blue: #0A84FF; --indigo: #5E5CE6; --teal: #40C8E0; --yellow: #FFD60A;
} }
/* Palette de l'écran : c0 vers c1 pour le dégradé, glow et glow2 pour le halo */
body {
  --c0: light-dark(#0B8F7A, #34E0C0); --c1: light-dark(#2158D6, #3A8DFF);
  --glow: light-dark(rgba(47,123,255,.30), rgba(58,141,255,.52)); --glow2: light-dark(rgba(25,195,164,.26), rgba(52,224,192,.38));
  --grad: linear-gradient(120deg, var(--c0), var(--c1)); /* calculé ici pour suivre la palette */
  transition: --c0 .6s ease, --c1 .6s ease, --glow .6s ease, --glow2 .6s ease;
}
body[data-tab="epargne"] { --c0: light-dark(#178A47, #7BE495); --c1: light-dark(#0B8F7A, #19C7B0); --glow: light-dark(rgba(40,190,110,.30), rgba(40,210,140,.46)); --glow2: light-dark(rgba(25,195,164,.24), rgba(120,230,150,.30)); }
body[data-tab="duree"] { --c0: light-dark(#3F63E6, #7AA2FF); --c1: light-dark(#7C3AED, #B06BFF); --glow: light-dark(rgba(130,100,255,.30), rgba(130,100,255,.50)); --glow2: light-dark(rgba(70,150,255,.24), rgba(70,150,255,.36)); }
body[data-tab="donnees"] { --c0: light-dark(#2563EB, #6FA8FF); --c1: light-dark(#4F46E5, #7B73FF); --glow: light-dark(rgba(60,110,255,.28), rgba(70,110,255,.44)); --glow2: light-dark(rgba(90,200,250,.22), rgba(90,200,250,.28)); }
body[data-tab="regles"] { --c0: light-dark(#4A5FD0, #8EA2FF); --c1: light-dark(#6B4FD8, #A58BFF); --glow: light-dark(rgba(100,110,230,.24), rgba(110,120,255,.38)); --glow2: light-dark(rgba(150,130,240,.2), rgba(150,130,255,.26)); }
body[data-tab="reste"][data-etat="trop"] { --c0: light-dark(#C95F00, #FFA23F); --c1: light-dark(#D42A45, #FF4D5E); --glow: light-dark(rgba(255,110,60,.32), rgba(255,96,60,.52)); --glow2: light-dark(rgba(255,64,110,.22), rgba(255,64,129,.34)); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.3 var(--sf); letter-spacing: -.01em; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  padding: var(--haut) max(16px, env(safe-area-inset-right)) calc(120px + var(--bas)) max(16px, env(safe-area-inset-left)); }
/* Halo de couleur, ancré aux 4 bords de l'écran (sur l'écran d'accueil de l'iPhone, une hauteur en vh laisse une bande vide en bas) */
body::before { content: ""; position: fixed; top: 0; bottom: 0; left: 0; right: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(120% 52% at 24% -6%, var(--glow), transparent 72%), radial-gradient(90% 40% at 96% 4%, var(--glow2), transparent 72%); }
/* Fondu sous la barre d'onglets : le contenu défile dessous sans la heurter */
body::after { content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: calc(112px + var(--bas)); z-index: 15; pointer-events: none;
  background: linear-gradient(to top, var(--bg) 42%, color-mix(in srgb, var(--bg) 0%, transparent)); }
button, a, [role="button"], summary { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
input, select, textarea { font-size: 16px; }
.app { max-width: 640px; margin: 0 auto; position: relative; z-index: 1; }

/* ---------- En-tête : date, grand titre à gauche, bouton en verre à droite ---------- */
.v-entete { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; min-height: 44px; padding: 14px 4px 14px; }
.v-entete > div { min-width: 0; }
.v-entete .v-sous { margin: 0 0 1px; font: 600 15px/1.25 var(--sf); color: var(--fg2); }
.v-entete .v-titre { margin: 0; }
.v-titre { font: 800 34px/1.08 var(--sf); letter-spacing: -.03em; margin: 0 4px 14px; }
.v-titre + .v-sous { margin-top: -12px; }
.v-sous { color: var(--fg2); font-size: 15px; margin: 2px 4px 14px; }
.v-section { display: flex; justify-content: space-between; align-items: baseline; font: 700 20px/1.2 var(--sf); letter-spacing: -.02em; margin: 24px 4px 9px; }
.v-section button { font: 500 15px var(--sf); color: var(--c1); background: none; border: 0; padding: 4px 0; cursor: pointer; }
/* Barre du haut compacte, visible quand le grand titre est sorti de l'écran */
.v-haut { position: fixed; top: 0; left: 0; right: 0; z-index: 30; padding: calc(var(--haut) + 10px) 16px 10px; text-align: center; font: 600 17px var(--sf);
  background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 .5px 0 var(--sep);
  opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity 180ms ease, transform 180ms var(--ease-out); }
.v-haut.on { opacity: 1; transform: none; }

/* ---------- Boutons ronds en verre ---------- */
.v-rond { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; color: var(--fg); cursor: pointer;
  background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  box-shadow: inset 0 0 0 .5px var(--glass-edge), 0 2px 10px rgba(0,0,0,.08); transition: transform 120ms var(--ease-out); }
.v-rond:active { transform: scale(.92); }

/* ---------- Cartes et listes groupées, en verre ---------- */
.v-carte { background: var(--verre); box-shadow: var(--verre-bord); border-radius: 26px; padding: 16px; margin-bottom: 12px; min-width: 0; }
.v-liste { background: var(--verre); box-shadow: var(--verre-bord); border-radius: 26px; overflow: hidden; margin-bottom: 12px; }
.v-ligne { display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 52px; position: relative; width: 100%; text-align: left;
  font: inherit; color: inherit; background: none; border: 0; transition: background-color 150ms ease; }
button.v-ligne, .v-ligne[role="button"], details > summary.v-ligne { cursor: pointer; }
button.v-ligne:active, .v-ligne[role="button"]:active, summary.v-ligne:active { background: var(--fill); }
@media (hover: hover) and (pointer: fine) { button.v-ligne:hover, .v-ligne[role="button"]:hover, summary.v-ligne:hover { background: color-mix(in srgb, var(--fill) 60%, transparent); } }
.v-liste > * + *::before, .v-liste details > .v-ligne + .v-ligne::before, .v-liste details > summary + .v-ligne::before { content: ""; position: absolute; top: 0; right: 0; left: 58px; border-top: .5px solid var(--sep); }
.v-liste > details + *::before, .v-liste > * + details > summary::before { content: ""; position: absolute; top: 0; right: 0; left: 58px; border-top: .5px solid var(--sep); }
.v-liste > details { position: relative; }
.v-liste > * + details::before { display: none; }
.v-liste.nu > * + *::before { left: 16px; }
/* Carré d'icône : léger dégradé et reflet en haut */
.v-carre { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(160deg, color-mix(in srgb, var(--t, var(--gray)) 78%, #fff), var(--t, var(--gray))); box-shadow: inset 0 1px 0 rgba(255,255,255,.38), 0 2px 6px -2px color-mix(in srgb, var(--t, var(--gray)) 60%, transparent); }
.v-txt { flex: 1; min-width: 0; }
.v-txt > b { display: block; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v-txt > small { display: block; color: var(--fg2); font-size: 13px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v-txt > .v-barre + small { margin-top: 5px; }
.v-ligne.haut { min-height: 60px; }
.v-liste.serre .v-ligne { min-height: 44px; padding: 7px 16px; }
.v-calc .v-ligne { min-height: 44px; padding: 8px 16px; }
.v-ligne.total .v-txt > b, .v-ligne.total .v-val { font-weight: 700; }
.v-val { text-align: right; white-space: nowrap; font-family: var(--sfr); font-weight: 600; }
.v-val small { display: block; color: var(--fg2); font: 400 13px var(--sf); }
.v-gris { color: var(--fg2); }
.v-hyp { font: 600 11px var(--sf); color: var(--c1); background: color-mix(in srgb, var(--c1) 14%, transparent); padding: 2px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
.v-champ { font: inherit; font-size: 17px; width: 104px; min-height: 44px; flex: none; text-align: right; padding: 6px 8px; border: 0; border-radius: 12px; background: var(--fill); color: var(--fg); }
.v-champ::placeholder { color: var(--fg3); }
.v-chev { flex: none; color: var(--fg3); }
details > summary { list-style: none; } details > summary::-webkit-details-marker { display: none; }
details[open] > summary .v-chev { transform: rotate(90deg); }
.v-chev { transition: transform 200ms var(--ease-out); }
.neg { color: var(--red) !important; } .pos { color: var(--green) !important; } .orange { color: var(--orange) !important; }
/* Jauges : dégradé de la couleur du poste, léger halo */
.v-barre { height: 7px; border-radius: 4px; background: var(--fill); margin-top: 7px; position: relative; overflow: hidden; }
.v-barre i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; --b: var(--blue);
  background: linear-gradient(90deg, color-mix(in srgb, var(--b) 62%, #fff), var(--b)); box-shadow: 0 0 10px color-mix(in srgb, var(--b) 55%, transparent); }
.v-barre b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fg); opacity: .45; }
.v-barre.grande { height: 9px; border-radius: 5px; margin-top: 12px; }
.v-entre { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.v-heros .v-barre + .v-entre { color: var(--fg2); font-size: 13px; margin-top: 6px; }
.v-bouton { display: flex; width: 100%; margin-top: 14px; }
.v-proj .v-txt > b { white-space: normal; line-height: 1.25; }
.v-proj .v-section { margin-top: 4px; }
.v-unite { font-size: 15px; min-width: 28px; }
.v-note { color: var(--fg2); font-size: 13px; margin: 6px 4px 0; line-height: 1.4; }
.v-note + .v-liste, .v-note + .v-carte { margin-top: 16px; }
.v-pastille { display: inline-flex; align-items: center; gap: 4px; font: 600 13px var(--sf); padding: 3px 9px; border-radius: 999px; background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
.v-pastille.r { background: color-mix(in srgb, var(--red) 15%, transparent); color: var(--red); }
.v-pastille.o { background: color-mix(in srgb, var(--orange) 18%, transparent); color: var(--orange); }

/* ---------- Ce mois-ci : carte du mois ---------- */
.v-heros { position: relative; overflow: hidden; border-radius: 28px; padding: 18px 18px 16px; }
.v-heros::before { content: ""; position: absolute; inset: 0; background: var(--grad); opacity: .16; pointer-events: none; }
@media (prefers-color-scheme: dark) { .v-heros::before { opacity: .22; } }
.v-heros > * { position: relative; }
.v-heros .lab { color: var(--fg2); font-size: 15px; font-weight: 500; }
.v-heros .montant { width: fit-content; max-width: 100%; font: 800 58px/1.04 var(--sfr); letter-spacing: -.04em; margin: 2px 0 3px; padding-bottom: 2px;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
.v-compte { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; min-height: 44px; margin-top: 12px; padding: 10px 0 0;
  font: inherit; font-size: 15px; color: var(--fg); background: none; border: 0; border-top: .5px solid var(--sep); text-align: left; cursor: pointer; }
.v-compte > span:first-child { color: var(--fg2); }
.v-compte > span:last-child { display: inline-flex; align-items: center; gap: 4px; font-family: var(--sfr); font-weight: 600; font-variant-numeric: tabular-nums; }
.v-compte svg { color: var(--fg3); }
.v-compte:active { opacity: .6; }
.v-ligne.action .v-txt > b { color: var(--c1); }
label.v-ligne { cursor: pointer; }
.v-switch { -webkit-appearance: none; appearance: none; flex: none; width: 51px; height: 31px; margin: 0; border-radius: 999px; background: rgba(120,120,128,.24); position: relative; cursor: pointer; transition: background-color 200ms ease; }
.v-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform 200ms var(--ease-out); }
.v-switch:checked { background: var(--green); }
.v-switch:checked::after { transform: translateX(20px); }
.v-switch:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .v-switch, .v-switch::after { transition: none; } }
.v-courbe svg { display: block; width: 100%; height: auto; margin-top: 8px; }
.v-courbe text { font: 12px var(--sf); fill: var(--fg2); }

/* ---------- Patrimoine ---------- */
.v-segment { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; background: var(--verre); box-shadow: var(--verre-bord); border-radius: 999px; padding: 3px; margin-bottom: 14px; }
.v-carte .v-segment { background: var(--fill); box-shadow: none; }
.v-segment button { font: 500 13px var(--sf); color: var(--fg2); background: none; border: 0; padding: 7px 4px; min-height: 44px; border-radius: 999px; cursor: pointer; transition: background-color 200ms ease, color 200ms ease; }
.v-segment button[aria-pressed="true"] { background: var(--seg-on); color: var(--fg); font-weight: 600; box-shadow: var(--seg-bord); }
.v-gros { font: 800 46px/1.05 var(--sfr); letter-spacing: -.04em; }
.v-graph svg { display: block; width: 100%; height: auto; margin-top: 10px; }
.v-graph text { font: 12px var(--sf); fill: var(--fg2); }
.v-input { font: inherit; font-size: 17px; width: 110px; min-height: 44px; text-align: right; padding: 6px 8px; border: 0; border-radius: 12px; background: var(--fill); color: var(--fg); }

/* ---------- Opérations ---------- */
.v-recherche { display: flex; align-items: center; gap: 6px; background: var(--verre); box-shadow: var(--verre-bord); border-radius: 999px; padding: 0 14px; color: var(--fg2); margin: 4px 0 12px; }
.v-recherche input { flex: 1; min-width: 0; border: 0; background: none; color: var(--fg); font: 17px var(--sf); padding: 9px 0; min-height: 48px; outline: none; }
.v-filtres { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 4px; }
.v-puce { font: 500 15px var(--sf); padding: 7px 14px; min-height: 44px; border-radius: 999px; border: 0; background: var(--verre); box-shadow: var(--verre-bord); color: var(--fg); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.v-puce.on { background: var(--grad); color: var(--on-accent); font-weight: 600; box-shadow: 0 8px 22px -8px var(--glow), inset 0 1px 0 rgba(255,255,255,.3); }
.v-menu { position: relative; padding: 0 12px 0 0; }
.v-menu select { -webkit-appearance: none; appearance: none; font: inherit; color: inherit; background: none; border: 0; min-height: 44px; padding: 0 4px 0 14px; cursor: pointer; }
.v-menu svg { transform: rotate(90deg); flex: none; pointer-events: none; opacity: .6; }
.v-jour { font: 600 15px var(--sf); color: var(--fg2); margin: 18px 4px 6px; }
.v-plus { display: block; margin: 8px auto 0; }

/* ---------- Pages poussées (écran suivant), avec leur propre halo ---------- */
.v-page { position: fixed; top: 0; bottom: 0; left: 0; right: 0; z-index: 40; overflow-y: auto; overscroll-behavior: contain;
  background: radial-gradient(120% 340px at 24% -60px, var(--glow), transparent 72%) no-repeat, radial-gradient(90% 280px at 96% -40px, var(--glow2), transparent 72%) no-repeat, var(--bg);
  padding: calc(var(--haut) + 6px) max(16px, env(safe-area-inset-right)) calc(40px + var(--bas)) max(16px, env(safe-area-inset-left));
  transform: translateX(100%); transition: transform 380ms var(--ease-drawer), visibility 0s linear 380ms; visibility: hidden; }
.v-page.on { transform: none; visibility: visible; transition: transform 380ms var(--ease-drawer), visibility 0s; }
.v-page .app { padding-bottom: 20px; }
.v-retour { display: inline-flex; align-items: center; gap: 2px; font: 17px var(--sf); color: var(--fg); min-height: 44px; padding: 0 16px 0 10px; margin: 6px 0 8px; border: 0; cursor: pointer;
  border-radius: 999px; background: var(--glass); box-shadow: inset 0 0 0 .5px var(--glass-edge), 0 2px 10px rgba(0,0,0,.06); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); }
.v-retour svg { transform: rotate(180deg); color: var(--c1); }

/* ---------- Barre d'onglets flottante en verre ---------- */
.v-onglets { position: fixed; z-index: 20; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); bottom: calc(10px + var(--bas));
  max-width: 560px; margin: 0 auto; height: 64px; border-radius: 32px; display: grid; grid-template-columns: repeat(5, 1fr); padding: 4px;
  background: var(--glass); -webkit-backdrop-filter: blur(28px) saturate(190%); backdrop-filter: blur(28px) saturate(190%); box-shadow: inset 0 0 0 .5px var(--glass-edge), inset 0 1px 0 rgba(255,255,255,.12), 0 10px 32px rgba(0,0,0,.18); }
.v-onglets button { display: grid; justify-items: center; align-content: center; gap: 2px; font: 600 10px var(--sf); color: var(--fg2); background: none; border: 0; border-radius: 28px; cursor: pointer; padding: 0; position: relative; transition: background-color 200ms ease, color 200ms ease, transform 120ms var(--ease-out); }
.v-onglets button[aria-selected="true"] { color: var(--c1); background: var(--seg-on); box-shadow: var(--seg-bord); }
.v-onglets button:active { transform: scale(.94); }
.v-pt { position: absolute; top: 7px; left: calc(50% + 8px); width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--bg); }
.v-pt.o { background: var(--orange); }

/* ---------- Messages ---------- */
.app-msg { position: fixed; z-index: 60; left: 12px; right: 12px; top: calc(var(--haut) + 8px); max-width: 520px; margin: 0 auto; display: flex; gap: 10px; align-items: center; justify-content: space-between;
  padding: 12px 14px; border-radius: 22px; font-size: 15px; background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  box-shadow: inset 0 0 0 .5px var(--glass-edge), 0 8px 30px rgba(0,0,0,.16); animation: v-tombe 300ms var(--ease-out); }
.app-msg.err { color: var(--red); }
.app-msg button { flex: none; font: 600 15px var(--sf); color: var(--c1); background: none; border: 0; padding: 4px; cursor: pointer; }
@keyframes v-tombe { from { opacity: 0; transform: translateY(-12px); } }
/* Le rappel de sauvegarde est la ligne « Sauvegarder » de Réglages et le point orange de l'onglet */
.app-save { display: none !important; }
.app-save button { font: 600 15px var(--sf); color: var(--c1); background: none; border: 0; cursor: pointer; }
.app-empty { max-width: 34rem; margin: 18vh auto 0; text-align: center; display: grid; gap: 14px; justify-items: center; position: relative; z-index: 1; }
.app-empty h1 { font: 800 34px var(--sf); letter-spacing: -.03em; margin: 0; }
.app-empty p { margin: 0; color: var(--fg2); line-height: 1.45; }
.app-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 54px; font: 700 17px/1.15 var(--sf); padding: 0 22px; border-radius: 999px; border: 0; background: var(--fill); color: var(--c1); cursor: pointer; transition: transform 120ms var(--ease-out), filter 120ms var(--ease-out); }
.app-btn.primary { background: var(--grad); color: var(--on-accent); box-shadow: 0 10px 30px -8px var(--glow), inset 0 1px 0 rgba(255,255,255,.35); }
.app-btn.danger { background: var(--red); color: #fff; }
.app-btn:active { transform: scale(.97); filter: brightness(.94); }

/* ---------- Feuilles qui montent du bas ---------- */
.app-dlg { position: fixed; inset: auto 0 0 0; margin: 0 auto; width: 100%; max-width: 560px; max-height: 92dvh; overflow-y: auto; border: 0; border-radius: 32px 32px 0 0;
  padding: 8px 16px calc(20px + var(--bas)); color: var(--fg); font-family: var(--sf); overscroll-behavior: contain;
  background: radial-gradient(120% 260px at 24% -50px, var(--glow), transparent 72%) no-repeat, radial-gradient(90% 220px at 96% -30px, var(--glow2), transparent 72%) no-repeat, color-mix(in srgb, var(--bg) 94%, transparent);
  -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); box-shadow: inset 0 .5px 0 var(--glass-edge), 0 -10px 40px rgba(0,0,0,.18);
  transition: transform 380ms var(--ease-drawer), overlay 380ms allow-discrete, display 380ms allow-discrete; }
.app-dlg:not([open]) { transform: translateY(100%); transition-duration: 260ms; }
@starting-style { .app-dlg[open] { transform: translateY(100%); } }
.app-dlg::backdrop { background: rgba(0,0,0,.34); transition: opacity 300ms ease, overlay 300ms allow-discrete, display 300ms allow-discrete; }
@starting-style { .app-dlg[open]::backdrop { opacity: 0; } }
.app-dlg .poignee { width: 36px; height: 5px; border-radius: 3px; background: var(--fg3); margin: 0 auto 6px; }
.app-dlg .zone-poignee { padding: 2px 0 8px; margin: -8px -16px 0; touch-action: none; cursor: grab; }
.app-dlg form { display: grid; gap: 12px; margin: 0; }
.app-dlg h2 { font: 700 20px var(--sf); letter-spacing: -.02em; margin: 0; text-align: center; }
.app-dlg p { margin: 0; font-size: 15px; color: var(--fg2); overflow-wrap: anywhere; line-height: 1.4; }
.app-dlg label { display: flex; gap: 8px; align-items: center; font-size: 15px; color: var(--fg2); }
.app-dlg input[type="text"], .app-dlg input[inputmode], .app-dlg input[type="password"], .app-dlg select { font: 17px var(--sf); padding: 12px 16px; border: 0; border-radius: 16px; background: var(--verre); box-shadow: var(--verre-bord); color: var(--fg); width: 100%; }
.app-dlg input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--c1); }
.app-dlg .row { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; margin-top: 4px; }
.app-err { color: var(--red) !important; }
.app-prop { display: grid; gap: 0; max-height: 52dvh; overflow: auto; background: var(--verre); box-shadow: var(--verre-bord); border-radius: 20px; }
.app-prop label { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; font-size: 15px; color: var(--fg); padding: 10px 14px; border-top: .5px solid var(--sep); }
.app-prop label:first-child { border-top: 0; }
.app-prop small { display: block; color: var(--fg2); font-size: 13px; }
/* Je veux acheter */
.app-dlg input.v-montant { text-align: center; font: 800 58px/1 var(--sfr); letter-spacing: -.04em; border: 0; background: none !important; box-shadow: none !important; color: var(--fg); width: 100%; padding: 6px 0 !important; }
.app-dlg .v-montant::placeholder { color: var(--fg3); }
.v-puces { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; margin: 0 -16px; padding: 2px 16px; scrollbar-width: none; }
.v-puces::-webkit-scrollbar { display: none; }
.v-puces .v-puce { flex: none; scroll-snap-align: start; }
.v-rep { display: grid; gap: 10px; }
.v-rep .v-carte { margin: 0; }
.v-verdict { display: flex; gap: 10px; align-items: center; font: 700 17px var(--sf); }
.v-rep p { margin: 8px 0 0; }

@media (prefers-reduced-motion: reduce) {
  body { transition: none; }
  .v-page, .v-page.on, .app-dlg, .app-dlg:not([open]) { transition-property: opacity, visibility, overlay, display; }
  .v-page { transform: none; opacity: 0; } .v-page.on { opacity: 1; }
  .app-dlg:not([open]) { transform: none; opacity: 0; } @starting-style { .app-dlg[open] { transform: none; opacity: 0; } }
  .app-msg { animation: none; }
  .app-btn:active, .v-rond:active, .v-onglets button:active { transform: none; }
}
@media (prefers-reduced-transparency: reduce) {
  .v-onglets, .v-rond, .v-haut, .v-retour, .app-msg { background: var(--card); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .v-carte, .v-liste, .v-segment, .v-recherche, .v-puce, .app-prop { background: var(--card); }
  .app-dlg { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; }
}
</style>
</head>
<body data-tab="reste">
<!-- Éléments utilisés par le code d'import et de sauvegarde -->
<div id="app-bar" hidden><span id="app-maj"></span><button type="button" id="app-export">Sauvegarder</button><button type="button" id="app-import">Importer</button></div>
<div class="app-msg" id="app-msg" role="status" hidden></div>
<input type="file" id="app-file" accept=".csv,.CSV,.zip,.json,text/csv,application/zip,application/json" hidden>
<div class="app-empty" id="app-empty" hidden>
  <h1>Budget</h1>
  <p>Aucune donnée sur cet appareil. La première fois, importe le fichier <b>budget-donnees.json</b> (montants de référence et historique). Ensuite, importe directement l’export de ta banque (.zip ou .csv). Tout reste sur ce téléphone.</p>
  <button class="app-btn primary" type="button" id="app-import-2">Importer mes données</button>
</div>

<div id="dash-root">
  <div class="v-haut" id="v-haut" aria-hidden="true"></div>
  <div class="app">
    <section class="bm-page" id="reste" role="tabpanel" aria-labelledby="t-reste">
      <header class="v-entete"><div><p class="v-sous" data-draw="v_mois_sous"></p><h1 class="v-titre" data-draw="v_mois_titre">Ce mois-ci</h1></div>
        <button class="v-rond" type="button" data-importer aria-label="Importer un export"><span data-icone="import"></span></button></header>
      <div class="v-carte v-heros" data-draw="v_heros"></div>
      <div data-draw="v_afaire"></div>
      <div data-draw="v_ou"></div>
    </section>

    <section class="bm-page" id="epargne" role="tabpanel" aria-labelledby="t-epargne" hidden>
      <header class="v-entete"><div><p class="v-sous" data-draw="v_ep_sous"></p><h1 class="v-titre">Épargne</h1></div></header>
      <div data-draw="v_ep"></div>
    </section>

    <section class="bm-page" id="duree" role="tabpanel" aria-labelledby="t-duree" hidden>
      <header class="v-entete"><div><p class="v-sous" data-draw="v_pat_sous"></p><h1 class="v-titre">Patrimoine</h1></div>
        <button class="v-rond" type="button" data-importer aria-label="Importer l’export Trade Republic"><span data-icone="import"></span></button></header>
      <div class="v-carte" data-draw="v_pat"></div>
      <div data-draw="v_comptes"></div>
    </section>

    <section class="bm-page" id="donnees" role="tabpanel" aria-labelledby="t-donnees" hidden>
      <header class="v-entete"><div><h1 class="v-titre">Opérations</h1></div></header>
      <label class="v-recherche"><span data-icone="loupe"></span><input type="search" id="v-q" placeholder="Rechercher" aria-label="Rechercher une opération" autocomplete="off"></label>
      <div data-draw="v_ops_filtres"></div>
      <div data-draw="v_ops"></div>
    </section>

    <section class="bm-page" id="regles" role="tabpanel" aria-labelledby="t-regles" hidden>
      <header class="v-entete"><div><h1 class="v-titre">Réglages</h1></div></header>
      <div class="app-msg app-save" id="app-save" hidden><span id="app-save-txt"></span><button type="button" id="app-save-btn">Sauvegarder</button></div>
      <div data-draw="v_reglages"></div>
      <button type="button" id="app-proposer" hidden></button>
    </section>
  </div>

  <div class="v-page" id="v-page" role="dialog" aria-modal="true" aria-labelledby="v-page-titre">
    <div class="app">
      <button type="button" class="v-retour" id="v-retour"><span data-icone="chev"></span><span id="v-retour-txt">Retour</span></button>
      <h1 class="v-titre" id="v-page-titre"></h1>
      <p class="v-sous" id="v-page-sous" hidden></p>
      <div id="v-page-corps"></div>
    </div>
  </div>

  <nav class="v-onglets" role="tablist" aria-label="Pages">
    <button class="bm-tab" role="tab" type="button" id="t-reste" data-tab="reste" aria-selected="true"><span data-icone="calendrier"></span>Ce mois-ci</button>
    <button class="bm-tab" role="tab" type="button" id="t-epargne" data-tab="epargne" aria-selected="false"><span data-icone="cible"></span>Épargne<i class="v-pt" id="pt-epargne" hidden></i></button>
    <button class="bm-tab" role="tab" type="button" id="t-duree" data-tab="duree" aria-selected="false"><span data-icone="hausse"></span>Patrimoine</button>
    <button class="bm-tab" role="tab" type="button" id="t-donnees" data-tab="donnees" aria-selected="false"><span data-icone="liste"></span>Opérations</button>
    <button class="bm-tab" role="tab" type="button" id="t-regles" data-tab="regles" aria-selected="false"><span data-icone="reglages"></span>Réglages<i class="v-pt o" id="pt-regles" hidden></i></button>
  </nav>
</div>
<script src="moteur.js"></script>
<script src="dash-shim.js"></script>
<script src="vues.js"></script>
</body>
</html>
